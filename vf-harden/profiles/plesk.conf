# shellcheck shell=bash disable=SC2034
# ===========================================================================
#  vf-harden/profiles/plesk.conf - Plesk web-hosting servers.
#  Picked automatically when /usr/local/psa exists (or: -p plesk).
#
#  Only what differs from default.conf. Each value comes from server A (hardened
#  by hand from the runbook) or server B (built from the template, then fixed). Its target state is server B as of 2026-10-22.
#  Site-specific values (addresses, account names) belong in
#  profiles.local/plesk.conf, which is gitignored.
# ===========================================================================

# ---- green ------------------------------------------------------------------ [used]
# V8: Plesk data, logs, mail, caches and agent state change all day. Without these
# excludes AIDE reports ~13k entries a night (server B) and reads 48G of customer files (server A).
# VERIFY against server A's /etc/aide/aide.conf.d/99_vf_plesk_excludes:
# while those differ, V8 reports a WARN and changes nothing.
AIDE_EXCLUDE_FILE=99_vf_plesk_excludes
AIDE_EXCLUDES="/var/www /var/lib/psa /var/lib/mysql /var/log /var/spool /var/cache /tmp /var/tmp
 /var/imunify360 /var/qmail/mailnames /var/qmail/queue
 /opt/psa/var /opt/psa/tmp /opt/psa/admin/logs
 /var/ossec/queue /var/ossec/var /var/ossec/logs /var/ossec/stats
 /var/lib/plesk/task-manager /var/lib/nginx/proxy /var/lib/nginx/body /run /usr/share/doc /usr/share/man
 /usr/lib/python3/dist-packages/.*/__pycache__"
PLESK_VHOSTS=/var/www/vhosts

# ---- yellow (target state = servers A and B on 2026-10-22) --------------------- [used]
# V6: Plesk sets site-user passwords as root -> no enforce_for_root, or site creation
# fails. pam-auth-update would leave/drop the pam_plesk.so lines -> PAM by hand.
PW_ENFORCE_FOR_ROOT=no
PWHISTORY_ENFORCE_FOR_ROOT=no       # server B has it on pwhistory: reported as WARN (user's decision)
PAM_MODE=manual
PAM_ANCHOR=pam_plesk.so
# Plesk site users inherit login.defs/useradd defaults: never 90 days / 45 inactive.
LOGIN_DEFS_PASS_MAX_DAYS=99999
PASS_INACTIVE=-1
# V3: cron.allow blocks Plesk scheduled tasks for NEW site users (CA-01 exception).
CRON_ALLOW_MODE=none
# G1: root by key from the intranet: the addresses go in profiles.local/plesk.conf.
# G6: the panel (psaadm) reads these logs.
LOG_PERM_EXCLUDE="/var/log/apt /var/log/plesk /var/log/sw-cp-server"
HOME_SCOPE=/home                    # never the vhost homes of site users
# G9: the Plesk stack is never masked (xinetd = customers' FTP, named = Plesk DNS).
PROTECTED_UNITS="apache2.service nginx.service xinetd.service named.service bind9.service postfix.service
 dovecot.service sw-cp-server.service sw-engine.service psa.service mariadb.service mysql.service"

# ---- red (target state = server B on 2026-10-22) -------------------------------- [used]
PASSWD_EXPIRY_FLAG=yes              # vf-passwd-expiry-flag.timer 08:00, journal tag vf-passwd-expiry
SITE_USER_GROUP=psacln              # VERIFY: reliable marker of Plesk site users? (MAPPING Q9)
PROTECTED_PACKAGES="apache2 nginx xinetd bind9 postfix dovecot-core dovecot-imapd dovecot-pop3d psa sw-cp-server sw-engine"
MTA_LOOPBACK_ONLY=no
# R3: rotate, never stop the box (DR-03 exception, server B since 2026-10-22).
AUDIT_ADMIN_SPACE_LEFT_ACTION=suspend
AUDIT_DISK_FULL_ACTION=suspend
# R5: allowed, with a loud warning: server B runs /tmp noexec through 4 Plesk updates,
# server A never had it (Plesk/Imunify updates were the worry).
TMP_NOEXEC=yes
# Ubuntu's apt timers collide with Plesk Daily Maintenance (~06:25).
APT_TIMER_SLOT="01:30 02:15"
