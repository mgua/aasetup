# shellcheck shell=bash disable=SC2034
# ===========================================================================
#  vf-harden/profiles/default.conf - the VF G-0312 policy, every variable.
#
#  Load order (later wins):  profiles/default.conf -> profiles/<profile>.conf
#                            -> profiles.local/default.conf -> profiles.local/<profile>.conf
#  profiles.local/ is gitignored: real names, addresses and accounts go there
#  (the house rule of this repo: real names, keys and hosts stay out of git).
#
#  Files are sourced as bash by root: they must be root-owned and not writable by
#  group/other, or --apply refuses to run.
#
#  [used] = read by an implemented step (green). [ready] = for yellow/red, not
#  read yet: listed now so every exception has one place, as in MAPPING.md s.3.
# ===========================================================================

# ---- general ----------------------------------------------------------------
HEALTHCHECK_HOOK=""                 # [used] executable run after each applied step; must exit 0
                                    #        (e.g. a site copy of p61-check.sh that fails on a diff)

# ---- V2 banner (CB) ------------------------------------------------------- [used]
BANNER_TEXT="Authorized users only. All activity may be monitored and reported."

# ---- V4 kernel / core (APH) ----------------------------------------------- [used]
V4_SYSCTL="kernel.randomize_va_space=2 kernel.yama.ptrace_scope=1 fs.suid_dumpable=0"

# ---- V5 filesystem modules (FKM) ------------------------------------------ [used]
FS_MODULES="cramfs freevxfs hfs hfsplus jffs2 usb-storage firewire-core"
BLOCK_UDF=no                        # runbook V5 leaves udf out; the template blocks it (FKM-08)
BLOCK_OVERLAY_SQUASHFS=no           # yes breaks Docker/containerd and snapd (FKM-06/07)

# ---- V7 journald (SL) ------------------------------------------------------ [used]
JOURNALD_STORAGE=persistent
JOURNALD_SYSTEM_MAX_USE=1G
JOURNALD_SYSTEM_KEEP_FREE=500M
JOURNALD_MAX_FILE_SEC=1month

# ---- V8 AIDE (IC) ---------------------------------------------------------- [used]
AIDE_EXCLUDES=""                    # space-separated paths, written as '!<path>' rules
AIDE_EXCLUDE_FILE=99_vf_excludes    # name in /etc/aide/aide.conf.d (no dots: x_include regex)
AIDE_COPYNEWDB=no                   # [ready] daily delta mode only once reports reach a person

# ---- V10 reports ----------------------------------------------------------- [used]
V10_FS_SCAN=yes                     # SFD-11..13 walk every local filesystem (slow on big servers)
PLESK_VHOSTS=/var/www/vhosts        # world-writable files below this are reported separately

# ---- yellow: password policy (V6) and PAM (G3) ---------------------------- [used]
LOGIN_DEFS_PASS_MAX_DAYS=90         # SP-01 default for NEW accounts (login.defs); 99999 = never
PASS_MIN_DAYS=1                     # SP-02 (minimum accepted)
PASS_WARN_AGE=7                     # SP-03 (minimum accepted)
PASS_INACTIVE=45                    # SP-05 useradd default (-1 = never auto-disable)
PW_MINLEN=14                        # PQ-01
PW_MINCLASS=4                       # PQ-02
PW_ENFORCE_FOR_ROOT=yes             # pwquality enforce_for_root
PAM_MODE=auto                       # auto = pam-auth-update (never --force) | manual = edit common-* by hand
PAM_ANCHOR=""                       # manual mode: a hand-added module that must survive (pam_plesk.so)
PW_REMEMBER=24                      # PH-01
PWHISTORY_ENFORCE_FOR_ROOT=yes      # a mismatch is reported (WARN), never changed
FAILLOCK_DENY=5                     # PF-01
FAILLOCK_UNLOCK=1800                # PF-02
FAILLOCK_ROOT_UNLOCK=60
FAILLOCK_EVEN_DENY_ROOT=yes
CONSOLE_STEPS="G3"                  # applied only with -C or alone (-o G3)

# ---- yellow: access (V3, G1, G2, G4, G5, G6) -------------------------------- [used]
CRON_ALLOW_MODE=existing            # V3: existing (users with crontabs) | empty | none (no cron.allow)
ROOT_LOGIN_ALLOW_FROM=""            # G1: "" = no root login at all; else IPv4 CIDRs/addresses for a
                                    #     'Match User root Address' (prohibit-password) block
SSH_ROOT_OUTSIDE_TEST=203.0.113.10  # G1: an address that must NOT get root (TEST-NET-3)
SSH_VERIFY_CASES=""                 # G1: "user@addr ..." whose forcecommand/allowusers must not change
SSH_DISABLE_FORWARDING=no           # SS-10 (L2)
SSH_MAX_AUTH_TRIES=4                # SS-04
SSH_CLIENT_ALIVE_INTERVAL=15        # SS-09
SSH_CLIENT_ALIVE_COUNT_MAX=3
SSH_LOGIN_GRACE_TIME=60             # SS-17
SSH_MAX_SESSIONS=10                 # SS-20
SSH_MAX_STARTUPS=10:30:60           # SS-21
SUDO_LOGFILE=/var/log/sudo.log      # G2 / PE-06 (+ logrotate rule vf-sudo)
SUDO_TIMESTAMP_TIMEOUT=15           # PE-02
SUGROUP=sugroup                     # G4 / PE-03
SUGROUP_MEMBERS=auto                # auto = sudo group + users in /etc/sudoers.d
ROOT_UMASK=027                      # G5 / UD-03, RT-08
SHELL_TMOUT=900                     # G5 / UD-02
HOME_SCOPE=/home                    # G6 touches homes below this only
LOG_PERM_EXCLUDE="/var/log/apt"      # G6: dirs under /var/log left as they are (apt re-creates its logs 0644 on every run)

# ---- yellow: network, time, services, mounts (G7-G11) ----------------------- [used]
NET_MODULES="dccp tipc rds sctp"    # G10
NTP_SERVERS=""                      # G8: company NTP servers (pending from Fabio); empty = N/A
MASK_UNITS="avahi-daemon.service avahi-daemon.socket isc-dhcp-server.service vsftpd.service slapd.service
 dovecot.service ypserv.service tftpd-hpa.service autofs.service named.service dnsmasq.service
 nfs-server.service cups.service cups.socket cups-browsed.service rpcbind.service rpcbind.socket
 smbd.service nmbd.service snmpd.service squid.service rsync.service"
PROTECTED_UNITS=""                  # G9: never masked, whatever MASK_UNITS says
REMOVE_CLIENTS="nis rsh-client talk telnet inetutils-telnet ldap-utils ftp tnftp"   # reported in G9, removed in red

# ---- red: accounts (R1, R2) -------------------------------------------------- [used]
PEOPLE_PASS_MAX_DAYS=90             # R1: SP-01 per person
PASSWD_EXPIRY_FLAG=no               # R1: expect vf-passwd-expiry-flag.timer (daily flag for EXPIRED passwords)
EXPIRY_EXEMPT=""                    # R1: accounts that never expire (break-glass)
PEOPLE_ACCOUNTS=auto                # R1: auto = password hash, UID >= UID_MIN, login shell, home in HOME_SCOPE,
                                    #     not SITE_USER_GROUP / SITE_USER_REGEX / R1_EXCLUDE; or an explicit list
R1_EXCLUDE=""                       # R1: accounts never touched (service accounts with a password, ...)
SITE_USER_GROUP=""                  # R1/R2: group of application-managed users (never touched)
SITE_USER_REGEX=""                  # R1/R2: name pattern of application-managed users (bash regex)
R2_NOLOGIN=""                       # R2: system accounts to switch to nologin (explicit, one by one)
R2_LOCK=""                          # R2: accounts without a valid shell to lock (explicit)

# ---- red: packages, /tmp, auditd, GRUB (R7, R5, R3, R4) ------------------------ [used]
PROTECTED_PACKAGES=""               # R7: never purged, whatever REMOVE_CLIENTS says
R7_ALLOW_ALSO=""                    # R7: metapackages a purge may also remove (e.g. ubuntu-standard), explicit
TMP_NOEXEC=yes                      # R5 / FP-16 (no = nodev,nosuid only)
TMP_SIZE=25%                        # R5: tmpfs size
REMOVE_SERVICES="avahi-daemon isc-dhcp-server vsftpd slapd dovecot-imapd dovecot-pop3d ypserv tftpd-hpa autofs bind9 dnsmasq nfs-kernel-server cups rpcbind samba snmpd squid"   # [ready] server purge: not implemented (G9 masks)
MTA_LOOPBACK_ONLY=yes               # [ready] CS-13: not implemented
SUDO_IMPL=classic                   # [ready] 26.04: classic (sudo.ws) | rs (sudo-rs: PE-06 exception)

# ---- red: auditd (R3) --------------------------------------------------------- [used]
ENABLE_AUDITD=yes
AUDIT_IMMUTABLE=no                  # informational: -e 2 is only ever written with -E (see R3)
AUDIT_OBSERVE_DAYS=7                # -E refused until the rules are this old
AUDIT_MAX_LOG_MB=32                 # DR-01
AUDIT_MAX_LOG_ACTION=rotate         # the template's keep_logs never deletes
AUDIT_NUM_LOGS=5
AUDIT_SPACE_LEFT_ACTION=syslog      # email needs working root mail
AUDIT_ADMIN_SPACE_LEFT_ACTION=single   # DR-03 as the standard asks (the service owner decides; Plesk: suspend)
AUDIT_DISK_FULL_ACTION=single          # DR-03
AUDIT_DISK_ERROR_ACTION=syslog
AUDIT_SKIP_RULES=""                 # rule keys left out, e.g. "access perm_mod" after the observation week

# ---- red: GRUB (R4) ------------------------------------------------------------ [used]
GRUB_SUPERUSER=grubadmin
GRUB_PASSWORD_HASH_FILE=""          # root-only (0600) file with the pbkdf2 hash; NEVER the hash itself here.
                                    # Alternative: VF_GRUB_PASSWORD_HASH in root's environment (never on a command line)

# ---- extras that are not VF controls --------------------------------------- [ready]
APT_TIMER_SLOT=""                   # e.g. "01:30 02:15" to keep apt away from Plesk maintenance
PLESK_MAIL_RELAY=""                 # informational: the relay set with Plesk's msmtpmng (host:port)
