# ===========================================================================
#  mysetup.conf - everything mysetup knows about THIS site lives here.
#
#  The mysetup script itself contains no user names, e-mail addresses, repo
#  URLs or package names: they are all below (or in the files this points to).
#  Copy the whole mysetup-etc/ folder, edit it, and the same tool provisions a
#  different site.
#
#  Placeholders {{LIKE_THIS}} are expanded in [vars], [ask] defaults, task
#  values, and in every source file whose name ends in .tmpl.
#
#  Built-in placeholders: USER HOME SHELL HOSTNAME FQDN GECOS UID GID
#                         DATE DATETIME ETC STATE OUT
#
#  Task sections are [task:<id>]; the shared keys are
#      title    menu label
#      kind     files | append | packages | repo | sshkey | authkeys
#               | sudoers | history | command | group
#      needs    variables to ask for before running (see [ask])
#      hidden   yes = keep out of the menu, still runnable via --do / a group
#      enabled  no  = ignore this task completely
# ===========================================================================

[vars]
# ---- site identity -------------------------------------------------------
domain           = tomware.it
# ---- upstream sources ----------------------------------------------------
nvim_config_repo = https://github.com/mgua/mg-nvim-2025.git
tpm_repo         = https://github.com/tmux-plugins/tpm
# ---- the git-client SSH identity this account uses -----------------------
# rsa/4096 matches the naming this site already uses (id_rsa_<user>, as in
# aasetup.sh) at a sane size - aasetup.sh's own default of 2048 is too small.
# For new sites prefer ed25519: shorter, faster, no size to get wrong. Changing
# ssh_key_type is all it takes; the file name follows it.
ssh_key_type     = rsa
ssh_key_bits     = 4096
ssh_key_name     = id_{{SSH_KEY_TYPE}}_{{USER}}
ssh_key_path     = {{HOME}}/.ssh/{{SSH_KEY_NAME}}
# ---- trzsz: file transfer through the ssh session ------------------------
# Not in Debian/Ubuntu: install from the upstream .deb. {{ARCH}} is uname -m.
trzsz_version    = 1.2.0
trzsz_rel_url    = https://github.com/trzsz/trzsz-go/releases/download/v{{TRZSZ_VERSION}}
trzsz_deb        = trzsz_{{TRZSZ_VERSION}}_linux_{{ARCH}}.deb
trzsz_deb_url    = {{TRZSZ_REL_URL}}/{{TRZSZ_DEB}}
trzsz_rpm        = trzsz_{{TRZSZ_VERSION}}_linux_{{ARCH}}.rpm
trzsz_rpm_url    = {{TRZSZ_REL_URL}}/{{TRZSZ_RPM}}

# ---- psprofile / oh-my-posh / chezmoi -----------------------------------
# The prompt theme comes from the PowerShell profile's own repo, so both
# platforms show the same prompt and there is one place to change it.
psprofile_repo   = https://github.com/mgua/psprofile
omp_theme_name   = slimfat2.omp.json
omp_theme_url    = https://raw.githubusercontent.com/mgua/psprofile/main/{{OMP_THEME_NAME}}
omp_version      = 30.6.5
omp_bin_url      = https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v{{OMP_VERSION}}/posh-linux-{{DEB_ARCH}}
omp_sums_url     = https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v{{OMP_VERSION}}/checksums.txt
chezmoi_version  = 2.72.0
chezmoi_rel_url  = https://github.com/twpayne/chezmoi/releases/download/v{{CHEZMOI_VERSION}}
chezmoi_deb      = chezmoi_{{CHEZMOI_VERSION}}_linux_{{DEB_ARCH}}.deb
chezmoi_rpm      = chezmoi-{{CHEZMOI_VERSION}}-{{ARCH}}.rpm

# ---- where your git server lives (used by files/ssh_config.tmpl) ---------
# These are this site's real values, taken from the aasetup repo's own remote
# (gitolite@twsgit01.twra.tomware.it). Change them for another site.
git_host         = twsgit01.twra.tomware.it
git_host_alias   = twsgit01
git_user         = gitolite
git_port         = 22

[ask]
# key = prompt text | default   (the default may use {{PLACEHOLDERS}})
# Answers are remembered in ~/.config/mysetup/answers.conf; --reset-answers
# forgets them, --set KEY=VALUE overrides them for one run.
git_name    = Git author name          | {{GECOS|USER}}
git_email   = Git e-mail address       | {{USER}}@{{DOMAIN}}
key_comment = SSH key comment          | {{GIT_EMAIL}}

[menu]
# Menu order. Anything not listed here is appended at the end.
order = sudoers, tools, filetransfer, gitconfig, nvim, vim, tmux, sshkey,
        sshconfig, authkeys, history, shell, chezmoi


# ===========================================================================
#  1. sudoers - we cannot write /etc/sudoers.d ourselves, so render the text
#     and hand it to an administrator (mysetup offers to sudo-install it too).
# ===========================================================================
[task:sudoers]
title    = sudoers snippet for this account
kind     = sudoers
description =
    Writes NOTHING by itself. Renders the sudo rule for this account, checks it
    with visudo, saves it under ~/.config/mysetup/out/ and prints the one-line
    install command for an administrator to run.
template = files/sudoers.tmpl
target   = /etc/sudoers.d/{{USER}}


# ===========================================================================
#  2. system tools - the only part that needs root; done through sudo.
# ===========================================================================
[task:tools]
title     = system tools (apt/dnf via sudo)
kind      = packages
description =
    Installs the system packages in mysetup-etc/packages.list that are missing,
    using sudo (apt-get/dnf). Already-installed packages are left alone, and the
    exact apt-get command is shown for approval before anything is installed.
list      = packages.list
npm_list  = npm-global.list
# fd-find installs its binary as 'fdfind'; telescope & friends look for 'fd'.
link_dir  = /usr/local/bin
links     = fd -> fdfind
            bat -> batcat


# ===========================================================================
#  2b. file transfer through the ssh session itself.
#      Needed to move a key, a config or a log between your machine and this
#      one without a second channel. Both halves have to be installed: this
#      one here, the matching one on YOUR machine.
# ===========================================================================
[task:filetransfer]
title = file transfer over the ssh session (trzsz / lrzsz)
kind  = group
description =
    Installs the server half of trzsz and/or lrzsz, so you can send files up
    and down an existing ssh session. THIS IS HALF THE JOB: your own terminal
    needs the matching client, and which one works depends on the terminal -
    read the notes each step prints. The right trzsz install for this distro is
    picked automatically - PPA on Ubuntu, upstream .deb on Debian, upstream
    .rpm on the RPM distros - and lrzsz is offered everywhere alongside it.
    Both work from Windows Terminal, because it is the ssh CLIENT that carries
    the protocol: 'tssh' for trz/tsz, 'tssh --zmodem' for rz/sz.
tasks = trzsz-ppa, trzsz-deb, trzsz-rpm, lrzsz

[task:trzsz-ppa]
title  = trzsz + tssh from the upstream PPA (Ubuntu)
kind   = command
hidden = yes
# PPAs are Ubuntu-only: on Debian add-apt-repository adds a source for a series
# that does not exist and apt update then fails.
when   = . /etc/os-release && [ "$ID" = ubuntu ]
description =
    trzsz carries files over the ssh session using its own protocol, and it is
    the option that works with an ordinary terminal such as Windows Terminal,
    because the protocol is driven by the CLIENT, not the terminal emulator.
    Its client also speaks ZMODEM, so installing this makes the old rz/sz work
    too, via 'tssh --zmodem'.
    The PPA is the better route on Ubuntu: apt keeps it updated. It ships both
    halves - trzsz (the trz/tsz you need HERE) and tssh (the client).
    On your own machine:  winget install trzsz.tssh  on Windows, or this same
    PPA on Ubuntu. Then connect with  tssh {{USER}}@{{FQDN}}  instead of ssh,
    and 'trz' here receives what you send while 'tsz FILE' sends one to you.
check  = command -v trz
run    =
    sudo apt-get install -y software-properties-common
    sudo add-apt-repository -y ppa:trzsz/ppa
    sudo apt-get update -qq
    sudo apt-get install -y trzsz tssh

[task:trzsz-deb]
title  = trzsz from the upstream .deb (Debian, non-Ubuntu)
kind   = command
hidden = yes
# Debian-family but NOT Ubuntu (Ubuntu has the PPA above). RPM distros take
# the .rpm entry below instead.
when   = command -v dpkg >/dev/null && . /etc/os-release && [ "$ID" != ubuntu ]
description =
    Same tool as the PPA entry, installed from the upstream release .deb
    because Debian packages neither trzsz nor tssh and the Ubuntu PPA does not
    apply here. Gets you 'trz' and 'tsz' on this box; there is no apt update
    path afterwards, so bump trzsz_version in mysetup-etc when a release lands.
    On your own machine:  winget install trzsz.tssh  (Windows), then connect
    with  tssh {{USER}}@{{FQDN}}  instead of ssh.
check  = command -v trz
run    =
    curl -fsSL -o /tmp/{{TRZSZ_DEB}} {{TRZSZ_DEB_URL}}
    sudo apt-get install -y /tmp/{{TRZSZ_DEB}}
    rm -f /tmp/{{TRZSZ_DEB}}

[task:trzsz-rpm]
title  = trzsz from the upstream .rpm (Fedora, RHEL, Rocky, openSUSE)
kind   = command
hidden = yes
# rpm-based and not Debian-family. Upstream publishes .rpm for the same
# releases as .deb, so trzsz is available here too - it is only apt that isn't.
when   = command -v rpm >/dev/null && ! command -v dpkg >/dev/null
description =
    Same tool as the other two trzsz entries, from the upstream release .rpm,
    since there is no PPA and no .deb to use here. -U installs or upgrades in
    place, so re-running after a version bump replaces the old one instead of
    complaining that trzsz is already installed. No repo afterwards, so bump
    trzsz_version in mysetup-etc when a release lands.
    On your own machine:  winget install trzsz.tssh  (Windows), then connect
    with  tssh {{USER}}@{{FQDN}}  instead of ssh.
check  = command -v trz
run    =
    curl -fsSL -o /tmp/{{TRZSZ_RPM}} {{TRZSZ_RPM_URL}}
    sudo rpm -Uvh /tmp/{{TRZSZ_RPM}}
    rm -f /tmp/{{TRZSZ_RPM}}

[task:lrzsz]
title  = lrzsz (ZMODEM rz/sz - only for terminals that speak ZMODEM)
kind   = packages
hidden = yes
description =
    lrzsz gives you the classic 'rz' and 'sz'. Unlike trzsz it is packaged by
    everyone - Debian, Ubuntu and the RPM distros - so it comes from the distro
    repository and stays updated by it.
    These speak ZMODEM, which the CLIENT has to implement - and trzsz does, so
    with 'tssh --zmodem host' they work in an ordinary terminal, Windows
    Terminal included. On the Windows side that needs both trzsz.tssh and
    trzsz.lrzsz from winget. Under bare ssh in a terminal with no ZMODEM of its
    own, rz waits for a transfer that never starts - so it is the client you
    check, not the emulator.
packages = lrzsz


# ===========================================================================
#  3. ~/.gitconfig
# ===========================================================================
[task:gitconfig]
title = git identity and defaults (~/.gitconfig)
kind  = files
description =
    Rewrites ~/.gitconfig with your git name and e-mail and the house defaults.
    An existing ~/.gitconfig that differs is backed up first.
needs = git_name, git_email
files = files/gitconfig.tmpl -> ~/.gitconfig 0644


# ===========================================================================
#  4. editors and multiplexer - three INDEPENDENT choices.
#     Neovim (with the house config), plain vim, and tmux are separate tools:
#     take any one, any two, or none. Nothing here depends on anything else
#     here. The tmux entry covers its own customisation, config plus plugins.
# ===========================================================================
[task:nvim]
title  = Neovim: the house configuration (clones a repo)
kind   = repo
description =
    Clones the house Neovim config into ~/.config/nvim and bootstraps its
    plugins headlessly. Needs network, and pulls in LSP servers and plugins.
    Independent of the vim and tmux entries - skip it and use plain vim if you
    want a small setup. An existing non-git ~/.config/nvim is backed up, not merged.
url    = {{NVIM_CONFIG_REPO}}
dest   = ~/.config/nvim
update = no
# Bootstrap the plugin manager without opening a UI; fall back to a bare start.
post   = nvim --headless '+Lazy! sync' +qa || nvim --headless +qa

[task:vim]
title  = vim: minimal ~/.vimrc (no plugins, no network)
kind   = files
description =
    Writes a small ~/.vimrc: line numbers, sane tabs, mouse, and SPACE-y to
    yank through OSC-52 so copying works over ssh. No plugins, no plugin
    manager, no network - this is the minimal option, and it works whether or
    not you took the Neovim entry.
files  = files/vimrc -> ~/.vimrc 0644

[task:tmux]
title  = tmux: configuration + plugins
kind   = group
description =
    Two steps for the terminal multiplexer: writes ~/.tmux.conf, then clones
    the tmux plugin manager and installs the plugins that config asks for.
    Needs network for the plugins. Independent of both editor entries.
tasks  = tmuxconf, tpm

[task:tmuxconf]
title  = ~/.tmux.conf
kind   = files
hidden = yes
description =
    Writes ~/.tmux.conf: mouse on, OSC-52 clipboard, vi copy mode, 50k
    scrollback, CTRL-b r to reload. Takes effect in new tmux sessions.
files  = files/tmux.conf -> ~/.tmux.conf 0644

[task:tpm]
title  = tmux plugin manager + plugins
kind   = repo
hidden = yes
description =
    Clones the tmux plugin manager into ~/.tmux/plugins/tpm and installs the
    plugins listed in ~/.tmux.conf. Same effect as pressing CTRL-b I. Needs network.
url    = {{TPM_REPO}}
dest   = ~/.tmux/plugins/tpm
# Same effect as pressing CTRL-b I inside tmux.
post   = ~/.tmux/plugins/tpm/bin/install_plugins


# ===========================================================================
#  5. the account's git-client SSH identity
# ===========================================================================
[task:sshkey]
title      = SSH key: create, upload or paste this account's key
kind       = sshkey
description =
    Asks how this account should get its key, because that is three different
    jobs: create a fresh one here with ssh-keygen, receive one you already have
    over the terminal with trz/rz, or paste one into an editor. Whichever you
    pick, the private half ends up 0600 with unix line endings, and you are
    offered the chance to authorise the public half for login.
needs      = key_comment
type       = {{SSH_KEY_TYPE}}
bits       = {{SSH_KEY_BITS}}
name       = {{SSH_KEY_NAME}}
dir        = ~/.ssh
comment    = {{KEY_COMMENT}}
# prompt (ask twice) | random (generate + save to ~/.config/mysetup/out) | none
passphrase = prompt

# Terminal file-transfer receivers for the upload path, first one that exists
# wins: trz is trzsz (installed by aasetup.sh), rz is lrzsz.
upload_commands = trz, rz

# Editor for the paste path. Left empty so $EDITOR wins if the operator has
# one, falling back to vim. Set it here to pin one regardless.
editor     =

# Write <key>.txt next to the key, recording the ssh-keygen command that made
# it - key type, size and comment, for whoever inherits the account. 0600.
record_command = yes

# Put the passphrase in that .txt as well. OFF, deliberately: the file sits next
# to the private key it would unlock, so recording it there cancels the
# passphrase out completely. Turn it on only if you understand that.
record_passphrase = no

authorized_keys = ~/.ssh/authorized_keys

# Shown when neither trz nor rz exists, so the greyed-out option says what to do.
upload_hint = run 'mysetup --do filetransfer', menu item 3


# ===========================================================================
#  6. ~/.ssh/config (+ known_hosts entries, if the site ships any)
# ===========================================================================
[task:sshconfig]
title = ~/.ssh/config for the known hosts
kind  = files
description =
    Rewrites ~/.ssh/config with the site's hosts, pinning this account's key so a
    personal key in your agent cannot be used by accident. Backs up what was there.
files = files/ssh_config.tmpl -> ~/.ssh/config 0600

[task:knownhosts]
title  = pre-seed ~/.ssh/known_hosts
kind   = append
hidden = yes
description =
    Appends the verified host keys from mysetup-etc/ssh/known_hosts to
    ~/.ssh/known_hosts. Does nothing until a human has filled that file in.
files  = ssh/known_hosts -> ~/.ssh/known_hosts 0644


# ===========================================================================
#  7. login keys: paste the public key(s) allowed to ssh into this account
# ===========================================================================
[task:authkeys]
title = authorise a public key for login (~/.ssh/authorized_keys)
kind  = authkeys
description =
    Lists the keys that may already log in here, then lets you paste more PUBLIC
    keys into ~/.ssh/authorized_keys. Private keys are refused. Adds only, never removes.
dest  = ~/.ssh/authorized_keys


# ===========================================================================
#  9. the shell itself: psprofile aliases + the Oh My Posh prompt.
#     Deliberately after everything else: it is the layer that makes the
#     account comfortable, not the layer that makes it work.
# ===========================================================================
[task:shell]
title = shell environment: psprofile aliases + Oh My Posh prompt
kind  = group
description =
    Installs ~/.psprofile.sh - the Linux counterpart of the PowerShell profile
    at {{PSPROFILE_REPO}} - and hooks it into ~/.bashrc, then installs Oh My
    Posh with the same slimfat2 theme the Windows side uses. Same alias names
    on both platforms: se/secd/lv for virtualenvs, fzcd/fzl/fzv for fzf,
    gst, cdh, sid, oo. Run 'psmenu' afterwards for the full list.
tasks = psprofile, bashrc-hook, ohmyposh

[task:psprofile]
title  = ~/.psprofile.sh (aliases, venv helpers, prompt toggle)
kind   = files
hidden = yes
description =
    The shell profile itself. Interactive-only: it returns immediately in a
    non-interactive shell, so scp and 'ssh host cmd' are not corrupted by
    output. Edit the site copy in mysetup-etc/files/psprofile.sh, not this one.
files  = files/psprofile.sh -> ~/.psprofile.sh 0644

[task:bashrc-hook]
title  = source ~/.psprofile.sh from ~/.bashrc
kind   = append
hidden = yes
description =
    Adds a guarded line to ~/.bashrc so the profile loads on login, with a
    comment saying what put it there. Appended only if not already present, and
    nothing else in ~/.bashrc is touched.
# The comments in the source ARE part of the snippet here, not notes about it.
keep_comments = yes
files  = files/bashrc-psprofile -> ~/.bashrc 0644

[task:ohmyposh]
title  = Oh My Posh + the slimfat2 theme
kind   = command
hidden = yes
description =
    Installs the Oh My Posh binary to ~/.local/bin (no root needed) and fetches
    the slimfat2 theme straight from the psprofile repo, so the prompt matches
    the Windows one and there is a single source of truth for it. The prompt
    shows folder, git state, python version and the active venv. Toggle it with
    'oo'. The download is checked against the release's published checksums
    rather than piped into a shell.
check  = command -v oh-my-posh >/dev/null || test -x {{HOME}}/.local/bin/oh-my-posh
run    =
    mkdir -p {{HOME}}/.local/bin {{HOME}}/.config/oh-my-posh
    curl -fsSL -o /tmp/posh-linux-{{DEB_ARCH}} {{OMP_BIN_URL}}
    curl -fsSL -o /tmp/omp-checksums.txt {{OMP_SUMS_URL}}
    (cd /tmp && grep " posh-linux-{{DEB_ARCH}}$" omp-checksums.txt | sha256sum -c -)
    install -m 0755 /tmp/posh-linux-{{DEB_ARCH}} {{HOME}}/.local/bin/oh-my-posh
    curl -fsSL -o {{HOME}}/.config/oh-my-posh/{{OMP_THEME_NAME}} {{OMP_THEME_URL}}
    rm -f /tmp/posh-linux-{{DEB_ARCH}} /tmp/omp-checksums.txt
    {{HOME}}/.local/bin/oh-my-posh version


# ===========================================================================
#  10. chezmoi: the dotfiles (and agent memory) that belong in git.
#      Install only - 'chezmoi init' points at a repository, which is a
#      decision for the operator, so it is printed rather than run.
# ===========================================================================
[task:chezmoi]
title = chezmoi (dotfiles under git)
kind  = group
description =
    Installs chezmoi, which the PowerShell profile already uses on the Windows
    side (its cmdiff alias). It manages dotfiles - and anything else worth
    keeping - in a git repository, so a rebuilt account can be restored rather
    than reconstructed. This installs the tool ONLY: pointing it at a
    repository is your decision and the next step prints how.
tasks = chezmoi-deb, chezmoi-rpm, chezmoi-next

[task:chezmoi-deb]
title  = chezmoi from the upstream .deb
kind   = command
hidden = yes
when   = command -v dpkg >/dev/null
description =
    Debian and Ubuntu package neither chezmoi nor oh-my-posh, so this takes the
    upstream release .deb. Bump chezmoi_version in mysetup-etc for a newer one.
check  = command -v chezmoi
run    =
    curl -fsSL -o /tmp/{{CHEZMOI_DEB}} {{CHEZMOI_REL_URL}}/{{CHEZMOI_DEB}}
    sudo apt-get install -y /tmp/{{CHEZMOI_DEB}}
    rm -f /tmp/{{CHEZMOI_DEB}}

[task:chezmoi-rpm]
title  = chezmoi from the upstream .rpm
kind   = command
hidden = yes
when   = command -v rpm >/dev/null && ! command -v dpkg >/dev/null
description =
    Same tool from the upstream .rpm, for Fedora, RHEL, Rocky and openSUSE.
check  = command -v chezmoi
run    =
    curl -fsSL -o /tmp/{{CHEZMOI_RPM}} {{CHEZMOI_REL_URL}}/{{CHEZMOI_RPM}}
    sudo rpm -Uvh /tmp/{{CHEZMOI_RPM}}
    rm -f /tmp/{{CHEZMOI_RPM}}

[task:chezmoi-next]
title  = what to do with chezmoi once it is installed
kind   = command
hidden = yes
check  = test -d {{HOME}}/.local/share/chezmoi/.git
description =
    chezmoi is installed but not pointed at anything. Which repository holds
    this account's dotfiles, and whether agent memory belongs in it, are not
    decisions mysetup should take for you - so this only prints the commands.
ignore_errors = yes
run    =
    printf '\n  chezmoi is installed. To start tracking this account:\n\n    chezmoi init            # new repo, or:\n    chezmoi init git@%s:dotfiles\n    chezmoi add ~/.gitconfig ~/.psprofile.sh ~/.tmux.conf\n    chezmoi cd && git remote -v && git push -u origin main\n\n  Then on any other box:  chezmoi init --apply <repo>\n\n  Before adding anything with secrets in it, read:\n    https://www.chezmoi.io/user-guide/frequently-asked-questions/encryption/\n\n' {{GIT_HOST}}


# ===========================================================================
#  8. command history preload - so a fresh account already knows the house
#     commands; press CTRL-r (or up-arrow) instead of reading the wiki.
# ===========================================================================
[task:history]
title         = preload the shell command history
kind          = history
description =
    Appends the house commands in mysetup-etc/history/ to ~/.bash_history, so
    CTRL-r finds them on a new account. Adds only what is not already there;
    visible in the NEXT shell you open.
sources       = history
bash_history  = ~/.bash_history
# Also import into atuin when aasetup_recording.sh installed it (local DB only).
atuin         = yes
