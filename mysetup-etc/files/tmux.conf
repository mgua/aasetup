#.tmux.conf by mgua@tomware.it - installed by mysetup (--do tmux).
# This must live in the home of the user that launches tmux.
# If you launch tmux as root it has to go in root's home instead.
# The plugin manager is cloned by the 'tpm' task: mysetup --do tpm
# Tmux Plugin Manager - (must be near the top)
set -g @plugin 'tmux-plugins/tpm'
# --- clipboard, via OSC-52 -------------------------------------------------
# 'on' (not the default 'external') means an application's OSC-52 write both
# lands in a tmux buffer AND is forwarded to the outer terminal, so a yank in
# vim reaches the Windows clipboard through ssh and tmux together.
set -g set-clipboard on

# TERM inside a pane. tmux >= 3.2 already defaults to this, but older tmux used
# screen-256color, whose terminfo carries an EMPTY Ms capability - and Ms is
# exactly what tmux consults to forward OSC-52 outward. Pinned so the clipboard
# does not silently depend on the tmux version.
set -g default-terminal "tmux-256color"

# Assert that the OUTER terminal accepts OSC-52, for emulators whose TERM does
# not advertise Ms. Windows Terminal does accept it. (tmux >= 3.2)
set -ga terminal-features ",xterm*:clipboard"

# Needed by nothing here, but the usual companion question: passthrough is for
# sequences tmux does NOT understand. OSC-52 it understands, so leave it off.
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
# reload config with CTRL-b r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
# Plugins (install with CTRL-b I, or headless via tpm/bin/install_plugins)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Colour scheme, if mysetup's theme task has written one. Must come BEFORE the
# TPM init below: a plugin declared after it is never loaded.
if-shell "[ -f ~/.tmux.theme.conf ]" "source-file ~/.tmux.theme.conf"

# Initialize TPM (must be the LAST line)
run '~/.tmux/plugins/tpm/tpm'
